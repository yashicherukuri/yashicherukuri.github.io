<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f9f7">
  <title>Projects | Yashi Cherukuri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; --background: #f7f9f7; --ink: #202923; --muted: #59675f; --accent: #176b50; --line: #d9e1dc; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--background); color: var(--ink); font-family: 'DM Sans', sans-serif; line-height: 1.6; letter-spacing: 0; }
    body::before { content: ''; position: absolute; inset: 0 0 auto; height: 340px; z-index: -1; background: linear-gradient(120deg, #eaf2ee, #f7f9f7 65%, #eef2f8); }
    .wrap { width: min(1080px, calc(100% - 48px)); margin-inline: auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 88px; border-bottom: 1px solid var(--line); }
    a { color: inherit; }
    .name { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600; text-decoration: none; }
    nav a { color: var(--accent); font-size: 14px; text-underline-offset: 6px; }
    main { padding-block: 64px 80px; min-height: calc(100vh - 170px); }
    h1, h2 { font-family: 'Space Grotesk', sans-serif; letter-spacing: 0; }
    h1 { font-size: 48px; line-height: 1.15; margin: 0 0 16px; font-weight: 600; }
    .intro { color: var(--muted); margin: 0 0 40px; font-size: 17px; }
    .section-heading { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; margin-bottom: 18px; }
    .section-heading h2 { font-size: 18px; margin: 0; font-weight: 500; }
    .count { color: var(--muted); font-size: 13px; }
    .projects { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
    .project { display: block; background: #fff; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; text-decoration: none; transition: border-color .2s, transform .2s; }
    .project:hover { border-color: var(--accent); transform: translateY(-3px); }
    .project:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }
    .project img { display: block; width: 100%; aspect-ratio: 16 / 10; height: auto; object-fit: cover; background: #dce8e5; }
    .project-content { padding: 24px; }
    .project-number { color: var(--accent); font-size: 12px; font-weight: 700; }
    .project h2 { font-size: 26px; line-height: 1.25; margin: 8px 0 12px; font-weight: 600; }
    .project p { color: var(--muted); font-size: 15px; margin: 0; }
    .project-link { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14px; font-weight: 600; color: var(--accent); }
    .arrow { font-size: 22px; line-height: 1; }
    footer { border-top: 1px solid var(--line); padding-block: 24px; font-size: 13px; color: var(--muted); }
    @media (max-width: 640px) {
      .wrap { width: calc(100% - 32px); }
      header { min-height: 76px; }
      .name { font-size: 16px; }
      main { padding-block: 40px 56px; }
      h1 { font-size: 36px; }
      .intro { font-size: 16px; margin-bottom: 32px; }
      .projects { grid-template-columns: minmax(0, 1fr); }
      .project-content { padding: 20px; }
    }
    @media (prefers-reduced-motion: reduce) { .project { transition: none; } .project:hover { transform: none; } }
  </style>
</head>
<body>
  <header class="wrap">
    <a class="name" href="index.html">Yashi Cherukuri</a>
    <nav aria-label="Main navigation"><a href="#projects">Projects</a></nav>
  </header>
  <main class="wrap">
    <h1>Projects</h1>
    <p class="intro">A collection of places, ideas, and digital experiences.</p>
    <section id="projects" aria-labelledby="projects-heading">
      <div class="section-heading">
        <h2 id="projects-heading">Selected Work</h2>
        <span class="count">01 project</span>
      </div>
      <div class="projects">
        <a class="project" href="project1.html" aria-labelledby="project1-title">
          <img src="assets/project1-preview.jpg" alt="Mount Fuji at sunset above a lakeside town" width="800" height="500" fetchpriority="high">
          <div class="project-content">
            <span class="project-number">PROJECT 01</span>
            <h2 id="project1-title">Mount Fuji Guide</h2>
            <p>Explore Mount Fuji, from trails and viewpoints to travel planning and local experiences.</p>
            <span class="project-link">View Project <span class="arrow" aria-hidden="true">&#8599;</span></span>
          </div>
        </a>
      </div>
    </section>
  </main>
  <footer class="wrap">Yashi Cherukuri &middot; Project Collection</footer>
</body>
</html>
